
networks:
  ses_analytics_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  jupyter_data:
    driver: local
  shared_parquet_storage:
    driver: local

services:
  jupyterlab:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: ses-jupyter-lab
    hostname: jupyter.local
    networks:
      ses_analytics_net:
        ipv4_address: 172.28.0.10
    ports:
      - "8889:8888"
    environment:
      - JUPYTER_TOKEN=secure_token_for_manager
      - SPARK_LOCAL_IP=172.28.0.10
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - shared_parquet_storage:/home/jovyan/work/data
    restart: unless-stopped

  agent_runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: ses-agent-runtime
    hostname: agent.local
    networks:
      ses_analytics_net:
        ipv4_address: 172.28.0.20
    ports:
      - "8081:8000"
    volumes:
      - shared_parquet_storage:/app/data
      - ./src:/app/src
    environment:
      - DATA_PATH=/app/data
    restart: unless-stopped
